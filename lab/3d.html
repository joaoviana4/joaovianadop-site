<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.min.js"}}</script>
<script type="module">
import * as THREE from "three";
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x000000,8,28);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const loader=new THREE.TextureLoader();
const tex=IMGS.map(u=>{const t=loader.load(u);t.colorSpace=THREE.SRGBColorSpace;return t});
const mats=tex.map(t=>new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide}));
// a strip = row of 4:3 stills (film strip with a thin dark border)
function strip(n,start,w=1.6,h=1.2,gap=.08){
  const g=new THREE.Group();const geo=new THREE.PlaneGeometry(w,h);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(n*(w+gap)+gap,h+.22),new THREE.MeshBasicMaterial({color:0x0b0b0b,side:THREE.DoubleSide}));back.position.z=-.01;g.add(back);
  for(let i=0;i<n;i++){const m=new THREE.Mesh(geo,mats[(start+i)%mats.length]);m.position.x=(i-(n-1)/2)*(w+gap);g.add(m)}
  g.userData.len=n*(w+gap);return g}
let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
let target=0,pos=0;addEventListener("wheel",e=>{target+=e.deltaY*.01},{passive:true});
let ty=null;addEventListener("touchstart",e=>ty=e.touches[0].clientY,{passive:true});addEventListener("touchmove",e=>{const y=e.touches[0].clientY;target+=(ty-y)*.03;ty=y},{passive:true});

// OPTION 2 v2 — the screen is always full: at every depth there are rows covering the whole height,
// and every row is an endless loop (two copies side by side), so the strips never end horizontally.
const W=1.6,H=1.2,GAP=.08,N=20,STEP=W+GAP,LEN=N*STEP;
const geo=new THREE.PlaneGeometry(W,H);
function row(start){const g=new THREE.Group();
  const back=new THREE.Mesh(new THREE.PlaneGeometry(LEN*2,H+.2),new THREE.MeshBasicMaterial({color:0x0b0b0b,transparent:true}));back.position.set(LEN/2-STEP/2,0,-.01);g.add(back);
  for(let c=0;c<2;c++)for(let i=0;i<N;i++){const m=new THREE.Mesh(geo,mats[(start+i)%mats.length].clone());m.material.transparent=true;m.position.x=c*LEN+i*STEP;g.add(m)}
  return g}
const PLANES=6,DZ=3.6,ROWGAP=2.7;   // rows every 1.5 units: strips touch with a thin gap, no dead space
const planes=[];
for(let k=0;k<PLANES;k++){const p=new THREE.Group();
  for(let j=-7;j<=7;j++){const r=row((k*7+j*3+60)%mats.length);r.position.y=j*ROWGAP+((k*0.37)%1)*ROWGAP;r.userData.dir=(j+k)%2?1:-1;r.userData.sp=.25+((j*7+k*3)%5)*.06;r.position.x=-LEN*Math.random();p.add(r)}
  p.position.z=2-k*DZ;planes.push(p);scene.add(p)}
camera.position.z=5;
const clock=new THREE.Clock();let camZ=5;
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();pos+=(target-pos)*.06;
  camZ=5-pos;camera.position.z=camZ;camera.position.x+=(mx*2.2-camera.position.x)*.05;camera.position.y+=(-my*1.6-camera.position.y)*.05;
  camera.lookAt(camera.position.x*.4,camera.position.y*.4,camZ-10);
  planes.forEach(p=>{
    // endless dive: a plane that goes behind the camera is sent to the back
    if(p.position.z>camZ-1.5)p.position.z-=PLANES*DZ; if(p.position.z<camZ-1.5-PLANES*DZ)p.position.z+=PLANES*DZ;
    const d=camZ-p.position.z, a=d<3?Math.max(0,(d-1.5)/1.5):1;   // fade out just before you pass through
    p.children.forEach(r=>{r.position.x+=r.userData.dir*dt*r.userData.sp; if(r.position.x>-STEP/2)r.position.x-=LEN; if(r.position.x<-LEN-STEP/2)r.position.x+=LEN;
      r.children.forEach(m=>m.material.opacity=a)})});
  renderer.render(scene,camera)});

</script></body></html>
